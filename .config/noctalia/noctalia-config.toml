[accessibility]
ui_scale = 1.1500000096857548

[audio]
enable_sounds = true

[bar.default]
background_opacity = 0.40999999083578587
border = "primary"
border_width = 1.5
capsule = true
capsule_padding = 7.0
capsule_radius = 8
center = [ "active_window" ]
color = "primary"
concave_edge_corners = false
end = [
    "notifications",
    "tray",
    "group:g1",
    "clipboard",
    "volume",
    "bluetooth",
    "brightness",
    "battery",
    "network",
    "session"
]
font_family = "JetBrainsMono NF"
font_weight = 700
icon_color = "primary"
margin_edge = 8
margin_ends = 10
radius = 10
scale = 1.300000011920929
start = [ "control-center", "clock", "workspaces", "media" ]
thickness = 45
widget_spacing = 8

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "sysmon", "cpu", "ram" ]
    opacity = 1.0
    padding = 7.0
    radius = 8.0

[battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
warning_threshold = 15

[control_center]
hidden_tabs = [ "media", "audio", "screen-time" ]
sidebar_section = "none"
width = 1000

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "power_profile"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 1280.0
    cy = 720.0
    output = "DP-6"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        clock_style = "analog"

[dock]
launcher_position = "start"
magnification = false
magnification_scale = 1.2000000029802322

[location]
address = "Reggio Emilia,Italy"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-6" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-6"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-6"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-6".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
filter_order = [ "filter" ]

    [notification.filter.filter]
    allow_permanent = true
    bypass_dnd = false
    enabled = true
    match = "qbz"
    play_sound = false
    save_history = true
    show_toast = true

[osd]
offset_y = 150
position = "bottom_center"

[shell]
avatar_path = "/home/notafanboy/Pictures/pixel slayer.jpg"
clipboard_history_max_entries = 10
corner_radius_scale = 0.20000000298023224
font_family = "Cantarell"

    [shell.animation]
    speed = 2.0000000298023224

    [shell.launcher]
    categories = false
    show_app_origin_indicator = false

    [shell.panel]
    control_center_placement = "floating"
    list_item_background = true
    open_near_click_control_center = true
    transparency_mode = "glass"
    wallpaper_placement = "floating"

[theme]
builtin = "Rosé Pine"
community_palette = "One"
custom_palette = "One-Custom"
source = "custom"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "cava", "hyprland" ]
    community_ids = [ "steam", "obs" ]

[wallpaper]
fill_mode = "fit"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/notafanboy/Pictures/wallpapers/wallpaper.jpg"

    [wallpaper.last]
    path = "/home/notafanboy/Pictures/wallpapers/wallpaper.jpg"

    [wallpaper.monitors.DP-6]
    path = "/home/notafanboy/Pictures/wallpapers/wallpaper.jpg"

    [[wallpaper.favorite]]
    builtin_palette = "Tokyo-Night"
    palette_source = "builtin"
    path = "/home/notafanboy/Pictures/wallpapers/wallpaper.jpg"
    theme_mode = "dark"

    [[wallpaper.favorite]]
    path = "/home/notafanboy/Pictures/wallpapers/eagle2-mobile.jpeg"
    theme_mode = "auto"

[widget.clipboard]
glyph = "clipboard-filled"

[widget.control-center]
glyph = "home-filled"

[widget.cpu]
stat = "cpu_freq"

[widget.media]
hide_when_no_media = true
title_scroll = "always"

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget.ram]
glyph = "container-filled"
stat = "ram_pct"

[widget.session]
glyph = "power"

[widget.tray]
color = "primary"
icon_color = "primary"

[widget.workspaces]
empty_color = "tertiary"
hide_when_empty = true
